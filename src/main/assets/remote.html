<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HeckYeah TV Remote</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* v1.25 (Part C): the page NEVER scrolls. The body is a flex
     column locked to the viewport height; every row is a fixed
     flex item and only the surface flexes to absorb the slack. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; gap: 10px;
    height: 100vh; height: 100dvh; max-width: 560px; margin: 0 auto;
    padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(14px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    user-select: none; -webkit-user-select: none;
  }
  body > * { flex: 0 0 auto; }
  button { font-family: inherit; color: #fff; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: 0.32; }
  svg { display: block; }

  /* ------------------------------------------------ top bar */
  header { display: flex; align-items: center; gap: 10px; padding: 2px 2px 0; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #ff453a; flex: 0 0 auto; }
  #dot.on { background: #30d158; }
  #brand { font-size: 16px; font-weight: 600; letter-spacing: 0.1px; white-space: nowrap; }
  #nowWrap { min-width: 0; flex: 1 1 auto; text-align: right; }
  #nowTitle { font-size: 12.5px; color: #f2f2f7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nowUrl { font-size: 11px; color: #8e8e93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ------------------------------------------------ segmented mode switch */
  #seg {
    display: flex; gap: 2px; background: #1c1c1e; border-radius: 10px; padding: 2px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .segBtn {
    flex: 1 1 0; background: transparent; border: 0; border-radius: 8px;
    padding: 7px 4px; font-size: 13.5px; font-weight: 600; color: #98989f;
  }
  .segBtn.active { background: #48484a; color: #fff; }
  /* ------------------------------------------------ the surface */
  #surface {
    /* v1.25 (Part C): no fixed aspect ratio - the surface is the
       one flexible row and takes whatever height is left. */
    position: relative; width: 100%; flex: 1 1 auto; min-height: 150px;
    border-radius: 30px; overflow: hidden;
    background: linear-gradient(180deg, #2c2c2e 0%, #1c1c1e 100%);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 12px 32px rgba(0,0,0,0.5);
  }
  #pad { position: absolute; inset: 0; touch-action: none; display: none; }
  /* v1.32: the in-surface hint text (#padHint) is GONE - Kurt
     asked for the surfaces completely text-free. */

  #clickpad { position: absolute; inset: 0; touch-action: none; display: none; }
  .zone {
    position: absolute; display: flex; align-items: center; justify-content: center;
    border-radius: 18px; transition: background 0.12s ease;
  }
  .zone svg { opacity: 0.75; pointer-events: none; }
  .zone.press { background: rgba(255,255,255,0.13); }
  #zUp    { top: 0;    left: 24%; right: 24%; height: 33%; align-items: flex-start;  padding-top: 16px; }
  #zDown  { bottom: 0; left: 24%; right: 24%; height: 33%; align-items: flex-end;    padding-bottom: 16px; }
  #zLeft  { left: 0;   top: 24%; bottom: 24%; width: 33%;  justify-content: flex-start; padding-left: 16px; }
  #zRight { right: 0;  top: 24%; bottom: 24%; width: 33%;  justify-content: flex-end;   padding-right: 16px; }
  #okBtn {
    position: absolute; left: 50%; top: 50%; width: 92px; height: 92px;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle at 50% 32%, rgba(255,255,255,0.22), rgba(255,255,255,0.10) 62%);
    border: 1px solid rgba(255,255,255,0.10);
    font-size: 17px; font-weight: 600; letter-spacing: 0.4px;
    transition: transform 0.1s ease, background 0.1s ease;
  }
  #okBtn.press { transform: translate(-50%, -50%) scale(0.93); background: rgba(255,255,255,0.24); }

  /* ------------------------------------------------ round glass buttons */
  #bigRow { display: flex; justify-content: space-evenly; align-items: center; padding: 2px 8px 0; }
  .round {
    width: 56px; height: 56px; border-radius: 50%; flex: 0 0 auto;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s ease, background 0.1s ease;
  }
  .round:active { background: rgba(255,255,255,0.24); transform: scale(0.94); }
  .round.press { background: rgba(255,255,255,0.24); transform: scale(0.94); }
  .round.gone { display: none; }

  /* ------------------------------------------------ media cluster (v1.24) */
  #mediaRow { display: flex; gap: 14px; align-items: center; }
  #seekCluster { flex: 1 1 auto; display: flex; justify-content: space-evenly; align-items: flex-start; }
  .skipCol { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .skipBtn { position: relative; width: 60px; height: 60px; }
  .skipBtn .skipTxt {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; pointer-events: none;
  }
  /* v1.32: .skipCap ("Skip back"/"Skip forward" captions under
     the skip buttons) removed - buttons keep aria-labels. */
  #volRocker {
    flex: 0 0 auto; width: 64px; height: 120px; border-radius: 32px; overflow: hidden;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-direction: column; position: relative;
  }
  #volRocker::after {
    content: ""; position: absolute; left: 13px; right: 13px; top: 50%;
    height: 1px; background: rgba(255,255,255,0.16); pointer-events: none;
  }
  .volHalf {
    flex: 1 1 0; background: transparent; border: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; transition: background 0.1s ease;
  }
  .volHalf.press, .volHalf:active { background: rgba(255,255,255,0.22); }

  /* ------------------------------------------------ pill rows + bars */
  .pillRow { display: flex; gap: 8px; }
  .pill {
    flex: 1 1 0; height: 42px; border-radius: 21px; border: 0;
    background: rgba(255,255,255,0.09); font-size: 14px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background 0.1s ease;
  }
  .pill:active { background: rgba(255,255,255,0.22); }
  .pill svg { opacity: 0.9; }
  /* v1.36: PiP active - the pill is lit accent (like the TV's
     Phone button when paired) to read as the way BACK to the app.
     The glyph strokes/fills are currentColor so it tints as one. */
  .pill.pipOn {
    color: #0a84ff; background: rgba(10,132,255,0.16);
    box-shadow: inset 0 0 0 1px rgba(10,132,255,0.55);
  }
  .bar { display: flex; gap: 8px; }
  .bar input {
    flex: 1 1 auto; min-width: 0; height: 44px;
    background: #1c1c1e; color: #fff;
    border: 1px solid rgba(255,255,255,0.09); border-radius: 12px;
    padding: 0 13px; font-size: 16px; outline: none; font-family: inherit;
  }
  .bar input::placeholder { color: #636366; }
  .bar button {
    flex: 0 0 auto; height: 44px; padding: 0 16px; border: 0; border-radius: 12px;
    background: rgba(255,255,255,0.12); font-size: 14.5px; font-weight: 600;
  }
  .bar button:active { background: rgba(255,255,255,0.24); }
  .bar button.accentBtn { background: #0a84ff; }
  .bar button.accentBtn:active { background: #409cff; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .gone { display: none !important; }

  /* -------------------------------------- v1.25 (Part F): URL / Type launchers
     The two text bars collapsed into one row of glass chips; each
     chip grows its panel out of itself, macOS Dock style. */
  #launchRow { display: flex; gap: 8px; }
  .chip {
    flex: 1 1 0; height: 44px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.09); background: #1c1c1e;
    color: #fff; font-size: 14.5px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .chip svg { opacity: 0.9; }
  .chip.active { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.22); }
  .chip.pulse { animation: dockPulse 0.18s ease; }
  @keyframes dockPulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  /* The wrap is a flex item whose max-height animates 0 <-> panel
     height; while open, the surface (the only flex-grow row)
     shrinks by the same amount, so the page still fits exactly.
     body.panelOpen also lowers the surface's min-height so a
     short phone can always make room. */
  #panelWrap {
    overflow: hidden; max-height: 0;
    transition: max-height 0.26s cubic-bezier(.2,1.35,.3,1);
  }
  body.panelOpen #surface { min-height: 88px; }
  #panelInner {
    transform: scale(0.85); opacity: 0; transform-origin: 50% 0;
    transition: transform 0.18s ease-in, opacity 0.15s ease-in;
    display: flex; flex-direction: column; gap: 8px;
  }
  #panelWrap.open #panelInner {
    transform: scale(1); opacity: 1;
    transition: transform 0.26s cubic-bezier(.2,1.35,.3,1), opacity 0.2s ease;
  }
  #panelType .bar { margin-bottom: 2px; }

  #note { min-height: 17px; font-size: 13px; color: #ffd60a; text-align: center; }
  #panelType #note { text-align: center; }

  /* ------------------------------------------------ pairing sheet (v1.37: compare-and-pair, no typed code) */
  #overlay {
    position: fixed; inset: 0; background: #000; z-index: 10;
    display: none; align-items: center; justify-content: center;
    padding: calc(20px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom));
  }
  #overlay.show { display: flex; }
  #pairBox { width: min(330px, 88vw); display: flex; flex-direction: column; gap: 14px; text-align: center; }
  #pairBox h1 { font-size: 22px; font-weight: 700; margin: 0; }
  #pairBox p { margin: 0; color: #98989f; font-size: 14px; line-height: 1.45; }
  #pairCode {
    font-size: 46px; font-weight: 700; letter-spacing: 10px; color: #0a84ff;
    font-variant-numeric: tabular-nums; line-height: 1.15;
  }
  #pairCount { font-size: 13px; color: #98989f; min-height: 16px; }
  #btnPair {
    background: #0a84ff; border: 0; border-radius: 14px; height: 50px;
    font-size: 16.5px; font-weight: 600; width: 100%;
  }
  #btnPair:active { background: #409cff; }
  #btnPairAlt {
    background: transparent; border: 1px solid rgba(255,255,255,0.18); border-radius: 14px;
    height: 46px; font-size: 15px; font-weight: 600; width: 100%; color: #fff;
  }
  #btnPairAlt:active { background: rgba(255,255,255,0.12); }
  #pairErr { color: #ff453a; font-size: 13px; min-height: 16px; }

  /* -------------------------------------- v1.25 (Part C): short screens
     Under ~700px of height the fixed rows compact so the surface
     keeps a usable size. */
  @media (max-height: 700px) {
    body { gap: 8px; }
    .round { width: 48px; height: 48px; }
    #okBtn { width: 76px; height: 76px; }
    .skipBtn { width: 52px; height: 52px; }
    #volRocker { height: 104px; }
    .pill { height: 38px; }
    .chip { height: 40px; }
    .bar input { height: 40px; }
    .bar button { height: 40px; }
  }
</style>
</head>
<body>
<header>
  <div id="dot"></div>
  <div id="brand">HeckYeah TV</div>
  <div id="nowWrap">
    <div id="nowTitle"></div>
    <div id="nowUrl">connecting…</div>
  </div>
</header>

<div id="seg">
  <button id="segPad" class="segBtn">Trackpad</button>
  <button id="segDpad" class="segBtn">D-Pad</button>
</div>
<div id="surface">
  <div id="pad"></div>
  <div id="clickpad">
    <div class="zone" id="zUp" data-k="up"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 15.1 L12 8.2 L19.4 15.1"/></svg></div>
    <div class="zone" id="zDown" data-k="down"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 8.9 L12 15.8 L19.4 8.9"/></svg></div>
    <div class="zone" id="zLeft" data-k="left"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.1 4.6 L8.2 12 L15.1 19.4"/></svg></div>
    <div class="zone" id="zRight" data-k="right"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.9 4.6 L15.8 12 L8.9 19.4"/></svg></div>
    <button id="okBtn">OK</button>
  </div>
</div>

<div id="bigRow">
  <button class="round" id="btnKeyBack" aria-label="Back"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M13.6 8.8 L10.8 12 L13.6 15.2"/></svg></button>
  <button class="round" id="btnPlay" aria-label="Play/Pause"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.3 7.8 L7.3 16.2 L14.3 12 Z" fill="#fff" stroke="none"/><path d="M17.1 8 L17.1 16"/><path d="M20.3 8 L20.3 16"/></svg></button>
  <button class="round" id="btnMenu" aria-label="Menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8 L19 8 M5 12 L19 12 M5 16 L19 16"/></svg></button>
  <button class="round" id="btnDone" aria-label="Done"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7 L17 17 M17 7 L7 17"/></svg></button>
</div>

<div class="pillRow" id="pillRowBrowser">
  <button class="pill" id="btnBack"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.1 4.6 L8.2 12 L15.1 19.4"/></svg>Back</button>
  <button class="pill" id="btnFwd">Forward<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.9 4.6 L15.8 12 L8.9 19.4"/></svg></button>
  <button class="pill" id="btnReload"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.89 17.82 A7.6 7.6 0 1 1 12.18 4.40" stroke-width="2" stroke-linecap="butt"/><polygon points="15.80,5.42 12.23,2.20 12.13,6.60" fill="#fff" stroke="none"/></svg>Reload</button>
  <button class="pill" id="btnPip"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3.5"/><rect x="12.5" y="11.5" width="6" height="4.5" rx="1.2" fill="currentColor" stroke="none"/></svg>PiP</button>
</div>
<div id="launchRow">
  <button class="chip" id="chipUrl" aria-label="Open URL bar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12 L20.5 12 M12 3.5 C14.8 6.2 14.8 17.8 12 20.5 C9.2 17.8 9.2 6.2 12 3.5 Z"/></svg>URL</button>
  <button class="chip" id="chipType" aria-label="Open typing bar"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.8" y="6" width="18.4" height="12" rx="2.5"/><path d="M6 9.8 L6.01 9.8 M10 9.8 L10.01 9.8 M14 9.8 L14.01 9.8 M18 9.8 L18.01 9.8 M6 14 L6.01 14 M18 14 L18.01 14 M9 14 L15 14"/></svg>Type</button>
</div>

<div id="panelWrap">
  <div id="panelInner">
    <div class="bar" id="panelUrl">
      <input id="urlInput" type="url" placeholder="Go to URL" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="btnGo" class="accentBtn">Go</button>
    </div>
    <div id="panelType" style="display: none;">
      <div class="bar">
        <input id="typeInput" type="text" placeholder="Type into the page…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="btnType">Send</button>
        <button id="btnEnter">Enter</button>
      </div>
      <div id="note"></div>
    </div>
  </div>
</div>

<div id="mediaRow">
  <div id="seekCluster">
    <div class="skipCol">
      <button class="round skipBtn" id="btnSeekBack" aria-label="Back 10 seconds"><svg width="48" height="48" viewBox="0 0 48 48" fill="none"><g transform="translate(48,0) scale(-1,1)"><path d="M38.05 30.55 A15.5 15.5 0 1 1 27.44 8.89" stroke="#fff" stroke-width="2.4" stroke-linecap="butt" fill="none"/><polygon points="32.89,11.30 28.08,6.06 26.80,11.71" fill="#fff"/></g></svg><span class="skipTxt">−10</span></button>
    </div>
    <div class="skipCol">
      <button class="round skipBtn" id="btnSeekFwd" aria-label="Forward 10 seconds"><svg width="48" height="48" viewBox="0 0 48 48" fill="none"><path d="M38.05 30.55 A15.5 15.5 0 1 1 27.44 8.89" stroke="#fff" stroke-width="2.4" stroke-linecap="butt" fill="none"/><polygon points="32.89,11.30 28.08,6.06 26.80,11.71" fill="#fff"/></svg><span class="skipTxt">+10</span></button>
    </div>
  </div>
  <div id="volRocker">
    <button class="volHalf" id="btnVolUp" aria-label="Volume up"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 5.5 L12 18.5 M5.5 12 L18.5 12"/></svg></button>
    <button class="volHalf" id="btnVolDown" aria-label="Volume down"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M5.5 12 L18.5 12"/></svg></button>
  </div>
</div>

<div id="overlay">
  <div id="pairBox">
    <h1>HeckYeah TV</h1>
    <p id="pairMsg">Requesting a pairing code…</p>
    <div id="pairCode" class="gone"></div>
    <div id="pairCount"></div>
    <button id="btnPair">Pair</button>
    <button id="btnPairAlt" class="gone">Cancel</button>
    <div id="pairErr"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  // Hold-to-repeat timing for the volume rocker (phone-side,
  // unchanged), and the trackpad two-finger scroll sensitivity
  // (1.0 = v1.22 feel). v1.39: clickpad DIRECTION holds no
  // longer repeat from this page at all - the phone sends one
  // {t:"key",h:1} on press and {h:0} on release, and the TV
  // owns the repeat (the v1.23 phone-side interval stream died
  // after ~3 steps in the field).
  var REPEAT_DELAY_MS = 400;
  var VOL_REPEAT_INTERVAL_MS = 120; // a touch slower: volume steps are coarse
  var SCROLL_FACTOR = 0.5;
  var ws = null;
  var connected = false;
  var reconnectTimer = null;
  var reconnectDelay = 800;
  var intentionalClose = false;
  // v1.38: socket ownership. wsGen increments on every connect();
  // each socket's handlers capture their own socket object and go
  // completely inert once it is no longer the current one — a
  // superseded socket's late error/close used to splash the
  // pairing overlay over a LIVE connection (the double-pairing
  // prompt). pairedKnown is the page's session belief: set true
  // when a socket opens or /pair/session answers 200, false only
  // on a proven 401 from that endpoint — never from a socket
  // event alone.
  var wsGen = 0;
  var pairedKnown = false;

  var dot = document.getElementById("dot");
  var nowTitle = document.getElementById("nowTitle");
  var nowUrl = document.getElementById("nowUrl");
  var noteEl = document.getElementById("note");
  var urlInput = document.getElementById("urlInput");
  var typeInput = document.getElementById("typeInput");
  var overlay = document.getElementById("overlay");
  var pairErr = document.getElementById("pairErr");
  var pairMsg = document.getElementById("pairMsg");
  var pairCodeEl = document.getElementById("pairCode");
  var pairCountEl = document.getElementById("pairCount");
  var btnPair = document.getElementById("btnPair");
  var btnPairAlt = document.getElementById("btnPairAlt");
  var noteTimer = null;

  function setConnected(on) {
    connected = on;
    dot.className = on ? "on" : "";
    if (!on) nowUrl.textContent = "disconnected";
  }

  function showNote(text) {
    noteEl.textContent = text || "";
    if (noteTimer) clearTimeout(noteTimer);
    if (text) noteTimer = setTimeout(function () { noteEl.textContent = ""; }, 5000);
  }

  function send(obj) {
    if (ws && ws.readyState === 1) {
      try { ws.send(JSON.stringify(obj)); } catch (e) { /* socket dying */ }
    }
  }

  function sendKey(k) { send({ t: "key", k: k }); }

  // ------------------------------------------------------------ modes
  // Auto mode follows the TV: browser open -> trackpad, anything
  // else -> D-pad. A tap on the segmented control overrides until
  // the TV's browser flag NEXT changes, then auto resumes.
  var mode = "dpad";
  var modeOverride = null;
  var lastBrowser = null;

  var pad = document.getElementById("pad");
  var clickpad = document.getElementById("clickpad");
  var segPad = document.getElementById("segPad");
  var segDpad = document.getElementById("segDpad");
  var panelWrap = document.getElementById("panelWrap");
  var lastAppliedMode = null;

  // v1.25 (Part B): trackpad surface on a TV menu - the TV is not
  // showing the browser, so there is no cursor to drive; the
  // surface navigates focus Apple-TV-style instead (see the
  // trackpad handlers).
  function inMenuNav() { return mode === "trackpad" && lastBrowser === false; }

  function applyMode() {
    // Part F: a real mode switch collapses the URL/Type panels
    // and kills any in-flight hold-repeat. v1.40: stopRepeat
    // joins the gate - it used to run unconditionally on
    // applyMode's first line, and handleState() calls applyMode
    // on EVERY state push (2.5s heartbeat included), so any
    // D-pad hold was guillotined by the next push even when the
    // mode never changed. Genuine switches still stop holds:
    // the seg buttons and the mode auto-follow both CHANGE the
    // mode, so lastAppliedMode differs there.
    if (lastAppliedMode !== null && lastAppliedMode !== mode) { stopRepeat(); collapsePanels(); }
    lastAppliedMode = mode;
    var isPad = mode === "trackpad";
    pad.style.display = isPad ? "block" : "none";
    clickpad.style.display = isPad ? "none" : "block";
    segPad.className = "segBtn" + (isPad ? " active" : "");
    segDpad.className = "segBtn" + (isPad ? "" : " active");
    // v1.28 (Part 4): the bottom controls are UNIFIED across
    // modes - the round row is [Back] [Play/Pause] [Menu] [Done],
    // the nav pill row and the URL/Type chips + panels show in
    // D-pad mode too, exactly as in trackpad mode. Only the
    // surface and the segmented control still differ. The TV-side
    // handlers cover the off-browser cases: Done/nav no-op
    // cleanly, URL opens the browser, Type answers with its
    // "no text field" note.
    // v1.32: the surfaces carry NO text at all - the in-surface
    // hint that used to be written here is deleted.
  }

  segPad.addEventListener("click", function () {
    modeOverride = "trackpad"; mode = "trackpad"; applyMode();
  });
  segDpad.addEventListener("click", function () {
    modeOverride = "dpad"; mode = "dpad"; applyMode();
  });

  function handleState(s) {
    if (s.title) nowTitle.textContent = s.title;
    if (typeof s.url === "string" && document.activeElement !== urlInput)
      urlInput.value = s.url;
    nowUrl.textContent = s.url || "";
    document.getElementById("btnBack").disabled = !s.canBack;
    document.getElementById("btnFwd").disabled = !s.canFwd;
    // v1.36: PiP up (either kind) -> the PiP pill lights as the way back.
    if (typeof s.pip === "boolean")
      document.getElementById("btnPip").className = "pill" + (s.pip ? " pipOn" : "");
    if (s.note) showNote(s.note);
    if (typeof s.browser === "boolean") {
      if (lastBrowser !== null && s.browser !== lastBrowser) modeOverride = null;
      lastBrowser = s.browser;
      var auto = s.browser ? "trackpad" : "dpad";
      var eff = modeOverride || auto;
      if (eff !== mode) { mode = eff; }
      applyMode();
    }
  }

  // v1.38: connect() is single-flight and generation-scoped.
  // Without force, a CONNECTING or OPEN socket is left strictly
  // alone (a leftover reconnect timer must never close a good
  // socket). force is reserved for the post-pair path in
  // onPaired(): a socket started BEFORE the session cookie
  // existed is known-doomed, so it is closed and recreated — now
  // safe, because the old socket's handlers are inert (below).
  function connect(force) {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (ws && !force && (ws.readyState === 0 || ws.readyState === 1)) return;
    if (ws) { try { ws.close(); } catch (e) {} ws = null; }
    var gen = ++wsGen;
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    var sock = null;
    try {
      sock = new WebSocket(proto + location.host + "/ws");
    } catch (e) {
      scheduleReconnect();
      return;
    }
    ws = sock;
    var sockOpened = false; // did THIS socket ever reach onopen?
    sock.onopen = function () {
      if (sock !== ws) return; // superseded: completely inert
      sockOpened = true;
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      setConnected(true);
      reconnectDelay = 800;
      pairedKnown = true;
      hidePairingOverlay();
    };
    sock.onmessage = function (ev) {
      if (sock !== ws) return;
      var msg = null;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg && msg.t === "state") handleState(msg);
    };
    sock.onclose = function () {
      if (sock !== ws) return; // superseded: no state, no timers, no overlay
      stopRepeat(); // never leave a repeat running on a dead socket
      setConnected(false);
      ws = null;
      if (intentionalClose) return;
      if (sockOpened) {
        // This session WAS valid (the socket opened): a transient
        // drop. The cookie re-authenticates on reconnect — never
        // splash pairing over a drop.
        scheduleReconnect();
        return;
      }
      // Never opened: the upgrade was refused (401 unpaired) OR
      // the server hiccuped. A close event cannot tell which —
      // ask the server (checkSessionThenAct) before doing
      // anything user-visible.
      checkSessionThenAct(gen);
    };
    sock.onerror = function () {
      if (sock !== ws) return;
      // Deliberately NO overlay here: an error event carries no
      // evidence the session is invalid, and browsers always pair
      // it with a close — onclose decides, with proof.
    };
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(function () {
      reconnectTimer = null;
      // While the pairing UI is active the reconnect loop is
      // PAUSED - just re-check later instead of connecting.
      if (overlay.className === "show") { scheduleReconnect(); return; }
      // v1.38: re-validate before connecting — if a socket has
      // since become CONNECTING/OPEN, this stale timer dies
      // quietly instead of closing it.
      if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
      reconnectDelay = Math.min(reconnectDelay * 1.6, 6000);
      connect();
    }, reconnectDelay);
  }

  // v1.38: the ONLY socket-path route to the pairing overlay.
  // After a never-opened socket closes, GET /pair/session (the
  // server checks the hy cookie exactly like the WS upgrade):
  //   200 -> still paired: reconnect silently (server hiccup).
  //   401 -> genuinely unpaired (first visit, server restart,
  //          session dropped): show the pairing overlay.
  //   network failure -> proves nothing: back off and retry.
  // The result is acted on only if nothing material changed
  // while the check was in flight (same socket generation, no
  // live/connecting socket, overlay not already up).
  function checkSessionThenAct(genAtClose) {
    fetch("/pair/session", { method: "GET", credentials: "same-origin" })
      .then(function (r) { return r.status; })
      .catch(function () { return 0; })
      .then(function (status) {
        if (genAtClose !== wsGen) return; // a newer socket exists
        if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
        if (overlay.className === "show") return;
        if (status === 200) {
          pairedKnown = true;
          scheduleReconnect();
        } else if (status === 401) {
          pairedKnown = false;
          showPairingOverlay();
        } else {
          scheduleReconnect();
        }
      });
  }

  // ------------------------------------------------------------ v1.37: compare-and-pair
  // The phone never types or submits a code. Opening the overlay
  // starts ONE pairing request (POST /pair/start, once per state
  // machine run); the server answers with a 6-digit code shown
  // here AND on the TV. Either side confirms: this page's Pair
  // button (POST /pair/confirm) or OK on the TV - the 1s status
  // poll (GET /pair/status) picks up a TV approval, cookie and
  // all, and connects the WebSocket.
  var pairPhase = "idle"; // idle|starting|live|error|expired|cancelled
  var pairReq = null;     // {id, key} of the live request
  var pairTimer = null;   // 1s countdown + poll interval
  var pairExpiresAt = 0;  // local deadline, ms epoch (server-corrected on poll)
  var pairPollBusy = false;

  function pairPost(path, bodyObj, ok, fail) {
    // v1.38: credentials explicit — the hy Set-Cookie on the
    // confirm/status responses must be stored/sent unambiguously
    // by phone browsers.
    var opts = { method: "POST", headers: { "Content-Type": "application/json" },
                 credentials: "same-origin" };
    if (bodyObj) opts.body = JSON.stringify(bodyObj);
    fetch(path, opts).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j }; })
        .catch(function () { return { status: r.status, body: null }; });
    }).then(function (res) { ok(res.status, res.body); }).catch(fail);
  }

  function clearPairTimer() {
    if (pairTimer) { clearInterval(pairTimer); pairTimer = null; }
  }

  function groupedPairCode(code) {
    return code && code.length === 6 ? code.slice(0, 3) + " " + code.slice(3) : (code || "");
  }

  function fmtPairClock(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }

  function showPairingOverlay() {
    var fresh = overlay.className !== "show";
    overlay.className = "show";
    if (fresh) startPairing();
  }

  function hidePairingOverlay() {
    overlay.className = "";
    pairPhase = "idle";
    pairReq = null;
    clearPairTimer();
    pairErr.textContent = "";
  }

  function pairStartErrorText(status) {
    if (status === 403) return "Two phones are already paired. Disconnect one on the TV first.";
    if (status === 409) return "Another phone is pairing — wait for it to finish, then try again.";
    if (status === 429) return "Too many pairing attempts — wait a minute and try again.";
    return "Pairing failed — try again.";
  }

  // Terminal-ish UI states: error / expired / cancelled all park
  // the machine with the primary button re-armed to start over.
  function pairPark(phase, msg, errText, btnLabel) {
    clearPairTimer();
    pairReq = null;
    pairPhase = phase;
    pairCodeEl.className = "gone";
    pairCountEl.textContent = "";
    btnPairAlt.className = "gone";
    pairMsg.textContent = msg;
    pairErr.textContent = errText || "";
    btnPair.textContent = btnLabel;
    btnPair.disabled = false;
  }

  function startPairing() {
    if (pairPhase === "starting" || pairPhase === "live") return; // one start per run
    pairPhase = "starting";
    pairReq = null;
    clearPairTimer();
    pairErr.textContent = "";
    pairCodeEl.className = "gone";
    pairCountEl.textContent = "";
    btnPairAlt.className = "gone";
    pairMsg.textContent = "Requesting a pairing code…";
    btnPair.textContent = "Pair";
    btnPair.disabled = true;
    pairPost("/pair/start", null, function (status, j) {
      if (pairPhase === "cancelled") {
        // Cancelled while the start was in flight: retire the
        // request server-side too, best-effort.
        if (status === 200 && j && j.ok) pairPost("/pair/cancel", { id: j.id, key: j.key },
          function () {}, function () {});
        return;
      }
      if (pairPhase !== "starting") return;
      if (status === 200 && j && j.ok) {
        pairPhase = "live";
        pairReq = { id: j.id, key: j.key };
        pairExpiresAt = Date.now() + (j.expiresIn || 60) * 1000;
        pairMsg.textContent = "Make sure this code matches the one on your TV.";
        pairCodeEl.textContent = groupedPairCode(j.code);
        pairCodeEl.className = "";
        btnPair.disabled = false;
        btnPairAlt.className = "";
        tickPair();
        pairTimer = setInterval(tickPair, 1000);
      } else {
        pairPark("error", "Couldn't get a pairing code.",
          status === 0 ? "Could not reach the TV. Same Wi-Fi network?" : pairStartErrorText(status),
          "Get a new code");
      }
    }, function () {
      if (pairPhase !== "starting") return;
      pairPark("error", "Couldn't get a pairing code.",
        "Could not reach the TV. Same Wi-Fi network?", "Get a new code");
    });
  }

  function tickPair() {
    if (pairPhase !== "live" || !pairReq) return;
    var left = pairExpiresAt - Date.now();
    if (left <= 0) {
      pairPark("expired", "Code expired", "", "Get a new code");
      return;
    }
    pairCountEl.textContent = "Code expires in " + fmtPairClock(left);
    pollPairStatus();
  }

  function pollPairStatus() {
    if (pairPollBusy || !pairReq) return;
    pairPollBusy = true;
    var req = pairReq;
    fetch("/pair/status?id=" + encodeURIComponent(req.id)
        + "&key=" + encodeURIComponent(req.key),
        { method: "GET", credentials: "same-origin" })
      .then(function (r) {
        return r.json().then(function (j) { return { status: r.status, body: j }; })
          .catch(function () { return { status: r.status, body: null }; });
      })
      .then(function (res) {
        pairPollBusy = false;
        if (pairPhase !== "live" || pairReq !== req) return; // superseded / cancelled
        var j = res.body || {};
        if (res.status === 200 && j.state === "approved") {
          onPaired(); // the TV confirmed first; cookie came with the response
        } else if (j.state === "denied") {
          pairPark("error", "Pairing declined",
            "The TV declined this pairing. Get a new code to try again.", "Get a new code");
        } else if (res.status === 410 || j.state === "expired") {
          pairPark("expired", "Code expired", "", "Get a new code");
        } else if (res.status === 200 && j.state === "pending"
            && typeof j.expiresIn === "number") {
          pairExpiresAt = Date.now() + j.expiresIn * 1000; // server clock wins
          pairCountEl.textContent = "Code expires in " + fmtPairClock(j.expiresIn * 1000);
        }
      })
      .catch(function () { pairPollBusy = false; });
  }

  function onPaired() {
    // v1.38: exactly ONE new socket results. pairedKnown is set,
    // every timer that could later close a good socket is dead,
    // and hidePairingOverlay() drops pairPhase to "idle" — any
    // in-flight status-poll/confirm callback that lands after
    // this finds its guards tripped and stays inert. connect
    // uses the forced post-pair path: a socket started before
    // the cookie existed is known-doomed.
    pairedKnown = true;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    hidePairingOverlay();
    reconnectDelay = 800;
    connect(true);
  }

  btnPair.addEventListener("click", function () {
    if (pairPhase === "live" && pairReq) {
      // The phone-side confirm of the dual-confirm flow.
      btnPair.disabled = true;
      pairErr.textContent = "";
      var req = pairReq;
      pairPost("/pair/confirm", { id: req.id, key: req.key }, function (status, j) {
        if (pairPhase !== "live" || pairReq !== req) return;
        if (status === 200 && j && j.ok) { onPaired(); return; }
        if (status === 410) {
          pairPark("expired", "Code expired", "", "Get a new code");
        } else if (status === 403) {
          pairPark("error", "Couldn't pair",
            "Two phones are already paired. Disconnect one on the TV first.", "Get a new code");
        } else {
          btnPair.disabled = false;
          pairErr.textContent = "Pairing failed — check the code matches, or get a new code.";
        }
      }, function () {
        if (pairPhase !== "live" || pairReq !== req) return;
        btnPair.disabled = false;
        pairErr.textContent = "Could not reach the TV. Same Wi-Fi network?";
      });
    } else if (pairPhase === "error" || pairPhase === "expired" || pairPhase === "cancelled") {
      startPairing(); // primary button re-armed: fresh request
    }
  });

  btnPairAlt.addEventListener("click", function () {
    if (pairPhase !== "live" && pairPhase !== "starting") return;
    var req = pairReq;
    pairPhase = "cancelled"; // set first: any in-flight start retires itself
    if (req) pairPost("/pair/cancel", { id: req.id, key: req.key },
      function () {}, function () {});
    pairPark("cancelled", "Pairing cancelled", "", "Try again");
  });

  // ------------------------------------------------------------ buttons
  function bind(id, fn) { document.getElementById(id).addEventListener("click", fn); }
  bind("btnKeyBack", function () { sendKey("back"); });
  bind("btnBack", function () { send({ t: "back" }); });
  bind("btnFwd", function () { send({ t: "fwd" }); });
  bind("btnReload", function () { send({ t: "reload" }); });
  bind("btnPip", function () { send({ t: "pip" }); });
  // v1.25 (Part D): Play/Pause fires on PRESS, not click - a bare
  // click can be swallowed when the page shifts under the finger
  // ("pause doesn't work until I click multiple times"). Same
  // press discipline as the volume halves: touchstart/mousedown
  // sends, timestamp guards keep the trailing synthetic click
  // from double-firing, and a bare click (keyboard/assistive)
  // still sends exactly one.
  (function () {
    var btnPlay = document.getElementById("btnPlay");
    var playTouchEndAt = 0, playMouseDownAt = 0;
    function firePlay() {
      send({ t: "playpause" });
      btnPlay.classList.add("press");
      setTimeout(function () { btnPlay.classList.remove("press"); }, 170);
    }
    btnPlay.addEventListener("touchstart", function (ev) {
      ev.preventDefault();
      firePlay();
    }, { passive: false });
    function playEnd(ev) {
      ev.preventDefault();
      playTouchEndAt = Date.now();
    }
    btnPlay.addEventListener("touchend", playEnd, { passive: false });
    btnPlay.addEventListener("touchcancel", playEnd, { passive: false });
    btnPlay.addEventListener("mousedown", function () {
      if (Date.now() - playTouchEndAt < 700) return; // touch already fired
      playMouseDownAt = Date.now();
      firePlay();
    });
    btnPlay.addEventListener("click", function () {
      if (Date.now() - playTouchEndAt < 700) return;
      if (Date.now() - playMouseDownAt < 700) return;
      firePlay(); // keyboard / assistive activation
    });
  })();
  bind("btnDone", function () { send({ t: "done" }); });
  bind("btnMenu", function () { sendKey("menu"); });
  // Volume is NOT click-bound here: the v1.24 rocker halves have
  // their own press handlers with hold-to-repeat (below).
  bind("btnSeekBack", function () { send({ t: "seek", s: -10 }); });
  bind("btnSeekFwd", function () { send({ t: "seek", s: 10 }); });
  bind("btnGo", function () {
    var u = (urlInput.value || "").trim();
    if (u) send({ t: "url", u: u });
    urlInput.blur();
  });
  urlInput.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") document.getElementById("btnGo").click();
  });
  bind("btnType", function () {
    var text = typeInput.value || "";
    if (text) send({ t: "type", text: text });
    typeInput.value = "";
  });
  bind("btnEnter", function () { send({ t: "key", k: "enter" }); });

  // ------------------------------------------------------------ v1.25 (Part F): launcher panels
  // One panel open at a time. Opening grows the panel out of its
  // chip: the wrap's max-height animates while the inner scales
  // 0.85 -> 1 with the transform-origin set at the top edge under
  // the chip that owns the panel, and the chip itself pulses like
  // a Dock icon being clicked. Because the surface is the only
  // flex-grow row, an open panel simply takes height from it -
  // the page total stays exactly the viewport (Part C).
  var panelInner = document.getElementById("panelInner");
  var panelUrl = document.getElementById("panelUrl");
  var panelType = document.getElementById("panelType");
  var chipUrl = document.getElementById("chipUrl");
  var chipType = document.getElementById("chipType");
  var openPanelName = null;
  var panelReleaseTimer = null;

  function pulseChip(chip) {
    chip.classList.remove("pulse");
    void chip.offsetWidth; // restart the animation if re-tapped fast
    chip.classList.add("pulse");
    setTimeout(function () { chip.classList.remove("pulse"); }, 200);
  }

  function showPanelEl(name) {
    panelUrl.style.display = name === "url" ? "flex" : "none";
    panelType.style.display = name === "type" ? "block" : "none";
    panelInner.style.transformOrigin = name === "url" ? "22% 0" : "78% 0";
    chipUrl.classList.toggle("active", name === "url");
    chipType.classList.toggle("active", name === "type");
  }

  function openPanel(name) {
    if (panelReleaseTimer) { clearTimeout(panelReleaseTimer); panelReleaseTimer = null; }
    var swapping = openPanelName !== null && openPanelName !== name;
    openPanelName = name;
    document.body.classList.add("panelOpen");
    if (swapping) {
      // Keep the wrap open; retarget its height to the new panel.
      panelWrap.style.maxHeight = panelWrap.offsetHeight + "px";
      showPanelEl(name);
      void panelWrap.offsetHeight;
      panelWrap.style.maxHeight = panelWrap.scrollHeight + "px";
    } else {
      showPanelEl(name);
      panelWrap.classList.add("open");
      panelWrap.style.maxHeight = "0px";
      void panelWrap.offsetHeight;
      panelWrap.style.maxHeight = panelWrap.scrollHeight + "px";
    }
    // Once grown, release max-height so the wrap is just its
    // content height in the flex column (the surface flexes).
    panelReleaseTimer = setTimeout(function () {
      panelReleaseTimer = null;
      if (openPanelName === name) panelWrap.style.maxHeight = "none";
    }, 300);
  }

  function collapsePanels() {
    if (panelReleaseTimer) { clearTimeout(panelReleaseTimer); panelReleaseTimer = null; }
    if (!openPanelName) return;
    openPanelName = null;
    chipUrl.classList.remove("active");
    chipType.classList.remove("active");
    document.body.classList.remove("panelOpen");
    // From a released ("none") max-height, pin the current height
    // first so the close transition has something to start from.
    panelWrap.style.maxHeight = panelWrap.scrollHeight + "px";
    void panelWrap.offsetHeight;
    panelWrap.classList.remove("open");
    panelWrap.style.maxHeight = "0px";
  }

  chipUrl.addEventListener("click", function () {
    pulseChip(chipUrl);
    if (openPanelName === "url") collapsePanels(); else openPanel("url");
  });
  chipType.addEventListener("click", function () {
    pulseChip(chipType);
    if (openPanelName === "type") collapsePanels(); else openPanel("type");
  });

  // ------------------------------------------------------------ clickpad (D-pad mode)
  var okBtn = document.getElementById("okBtn");
  var zones = {
    up: document.getElementById("zUp"),
    down: document.getElementById("zDown"),
    left: document.getElementById("zLeft"),
    right: document.getElementById("zRight")
  };
  var cpStartX = 0, cpStartY = 0, cpTarget = null, cpSwipeFired = false, cpActive = false;
  var cpPressFired = false; // this touch already delivered its key on press-down
  var lastTouchEnd = 0;
  var lastMouseDown = 0;    // a clickpad mousedown that already fired its key

  function pressFx(el) {
    if (!el) return;
    el.classList.add("press");
    setTimeout(function () { el.classList.remove("press"); }, 170);
  }
  function cpSend(k) {
    sendKey(k);
    pressFx(k === "ok" ? okBtn : zones[k]);
  }

  // ----- hold-to-repeat. The shared helper below now drives
  // ONLY the volume rocker halves (sending {"t":"vol"}
  // messages): startRepeat takes a send-thunk, fires it
  // immediately, then re-fires it every intervalMs once
  // REPEAT_DELAY_MS has passed. Clickpad direction holds use
  // the TV-owned protocol further down (startKeyHold). Exactly
  // ONE hold of either kind can be active at a time — starting
  // one stops the other, because stopRepeat() also releases
  // any key hold (see stopKeyHold). -----
  var repeatSendFn = null;
  var repeatEl = null;   // element that stays .press-lit for the hold
  var repeatDir = null;  // legacy: only volume uses startRepeat now (always null dir)
  var repeatDelayTimer = null;
  var repeatIntervalTimer = null;

  function startRepeat(sendFn, el, intervalMs, dir) {
    stopRepeat(); // a new press replaces any active repeat, never stacks
    repeatSendFn = sendFn;
    repeatEl = el || null;
    repeatDir = dir || null;
    sendFn(); // immediate first press, exactly like a tap
    if (repeatEl) repeatEl.classList.add("press"); // stays lit for the whole hold
    repeatDelayTimer = setTimeout(function () {
      repeatDelayTimer = null;
      if (repeatSendFn !== sendFn) return;
      repeatIntervalTimer = setInterval(function () {
        if (repeatSendFn !== sendFn) { stopRepeat(); return; }
        if (!ws || ws.readyState !== 1) { stopRepeat(); return; } // dead socket: stop, don't queue
        sendFn();
      }, intervalMs);
    }, REPEAT_DELAY_MS);
  }

  function stopRepeat() {
    if (repeatDelayTimer) { clearTimeout(repeatDelayTimer); repeatDelayTimer = null; }
    if (repeatIntervalTimer) { clearInterval(repeatIntervalTimer); repeatIntervalTimer = null; }
    if (repeatEl) repeatEl.classList.remove("press");
    repeatSendFn = null;
    repeatEl = null;
    repeatDir = null;
    stopKeyHold(); // v1.39: every stop path also releases a TV key hold
  }

  // ----- v1.39: TV-owned direction holds. Pressing a zone
  // sends ONE {t:"key",k:dir,h:1}; the TV fires the first step
  // and repeats it until the matching h:0 arrives. There are
  // deliberately NO mid-hold kill paths left on this page: the
  // old touchmove slide-off check and the flick cancel used to
  // murder real holds (finger micro-drift, press transforms,
  // SVG children confusing elementFromPoint) - a hold now ends
  // only on a genuine release path, and every one of those
  // funnels through stopRepeat() -> stopKeyHold(): touchend,
  // touchcancel, mouseup, clickpad mouseleave, window blur,
  // mode switch (applyMode), current-socket close (onclose),
  // flick recognition, or a new press replacing this one.
  // Direction zones only (never OK: repeated selects would be
  // destructive). -----
  var keyHoldDir = null;
  var keyHoldEl = null;

  function startKeyHold(dir) {
    stopRepeat(); // releases any prior key hold + any volume repeat
    keyHoldDir = dir;
    keyHoldEl = zones[dir] || null;
    if (keyHoldEl) keyHoldEl.classList.add("press"); // lit for the whole hold
    send({ t: "key", k: dir, h: 1 });
  }

  function stopKeyHold() {
    if (keyHoldEl) { keyHoldEl.classList.remove("press"); keyHoldEl = null; }
    if (!keyHoldDir) return;
    var dir = keyHoldDir;
    keyHoldDir = null;
    send({ t: "key", k: dir, h: 0 });
  }

  function startVolRepeat(d, el) {
    startRepeat(function () { send({ t: "vol", d: d }); }, el, VOL_REPEAT_INTERVAL_MS, null);
  }
  function cpHit(el) {
    while (el && el !== clickpad) {
      if (el === okBtn) return "ok";
      if (el.getAttribute && el.getAttribute("data-k")) return el.getAttribute("data-k");
      el = el.parentNode;
    }
    return null;
  }

  clickpad.addEventListener("touchstart", function (ev) {
    ev.preventDefault();
    var t = ev.changedTouches[0];
    cpStartX = t.clientX; cpStartY = t.clientY;
    cpTarget = cpHit(ev.target);
    cpSwipeFired = false; cpActive = true;
    cpPressFired = false;
    // A direction zone starts a TV-owned hold on press-down
    // (a second finger on another zone replaces it via
    // startKeyHold). OK deliberately does not: it still fires
    // exactly once, on release, in cpEnd.
    if (cpTarget && cpTarget !== "ok") {
      cpPressFired = true;
      startKeyHold(cpTarget);
    }
  }, { passive: false });

  clickpad.addEventListener("touchmove", function (ev) {
    ev.preventDefault();
    if (!cpActive) return;
    var t = ev.changedTouches[0];
    // v1.39: NO slide-off check here anymore. It killed real
    // direction holds mid-press (see startKeyHold) - a hold is
    // a hold until the finger actually lifts.
    // v1.40: a press-fired direction touch is a HOLD, full stop:
    // movement does nothing at all. The flick check below used
    // to run for these touches too and called stopRepeat() ->
    // stopKeyHold() (h:0) at >=44px of drift - a thumb settling
    // into a hold drifts ~44px (~7mm) in ~0.3-0.6s, presenting
    // on device as "initial step + repeats at 350/460ms = three
    // steps, then dies", the same count since v1.23. A flick
    // that starts on a zone releases before the TV's first
    // repeat (350ms), so it naturally yields exactly one step;
    // distance travelled while the finger is DOWN cannot
    // distinguish flick from hold.
    if (cpPressFired) return;
    if (cpSwipeFired) return;
    var dx = t.clientX - cpStartX, dy = t.clientY - cpStartY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 44) return;
    // Only non-press-fired touches reach here (v1.40 above):
    // a decisive flick that began off a zone (OK, gaps between
    // zones) = that direction, like flicking across the real
    // Apple TV clickpad, and it fires exactly one key, here.
    // Recognizing a flick also ends any in-flight repeat
    // (stopRepeat -> stopKeyHold sends h:0), so a finger that
    // lingers after flicking never starts repeating on the TV.
    cpSwipeFired = true;
    stopRepeat();
    cpSend(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  }, { passive: false });

  function cpEnd(ev) {
    ev.preventDefault();
    lastTouchEnd = Date.now();
    stopRepeat(); // release and touchcancel both land here
    // cpPressFired touches already delivered their key on
    // press-down; OK (never press-fired) fires here as before.
    if (cpActive && !cpSwipeFired && cpTarget && !cpPressFired) cpSend(cpTarget);
    cpActive = false; cpTarget = null; cpSwipeFired = false; cpPressFired = false;
  }
  clickpad.addEventListener("touchend", cpEnd, { passive: false });
  clickpad.addEventListener("touchcancel", cpEnd, { passive: false });

  // Mouse fallback for the clickpad (desktop testing): direction
  // zones start a TV-owned hold on mousedown just like touch; the
  // trailing click is then suppressed, because mousedown already
  // delivered the key. v1.39: sliding off a zone no longer kills
  // a mouse hold either (the per-zone mouseleave handler is
  // gone) - mouseup, clickpad mouseleave and window blur remain
  // the release paths, all via stopRepeat() -> stopKeyHold().
  clickpad.addEventListener("mousedown", function (ev) {
    var hit = cpHit(ev.target);
    if (hit && hit !== "ok") {
      lastMouseDown = Date.now();
      startKeyHold(hit);
    }
  });
  document.addEventListener("mouseup", function () { stopRepeat(); });
  clickpad.addEventListener("mouseleave", function () { stopRepeat(); });
  window.addEventListener("blur", function () { stopRepeat(); });
  Object.keys(zones).forEach(function (k) {
    zones[k].addEventListener("click", function () {
      if (Date.now() - lastTouchEnd < 700) return; // touch already handled it
      if (Date.now() - lastMouseDown < 700) return; // mousedown already handled it
      cpSend(k);
    });
  });
  okBtn.addEventListener("click", function () {
    if (Date.now() - lastTouchEnd < 700) return;
    cpSend("ok");
  });

  // ------------------------------------------------------------ volume rocker (v1.24)
  // One capsule, two halves: top = vol +, bottom = vol −. Each
  // half fires on press-down and hold-repeats through the shared
  // startRepeat helper (so it also cancels / is cancelled by a
  // clickpad repeat). Same stop discipline as the clickpad:
  // release, touchcancel, sliding off the half, mode switch
  // (applyMode), socket close (ws.onclose), document mouseup and
  // window blur all stop it — those shared stop paths call
  // stopRepeat(), which clears this repeat too.
  var volTouchEndAt = 0;
  var volMouseDownAt = 0;
  [["btnVolUp", 1], ["btnVolDown", -1]].forEach(function (pair) {
    var btn = document.getElementById(pair[0]);
    var d = pair[1];
    btn.addEventListener("touchstart", function (ev) {
      ev.preventDefault();
      startVolRepeat(d, btn);
    }, { passive: false });
    function volEnd(ev) {
      ev.preventDefault();
      volTouchEndAt = Date.now();
      if (repeatEl === btn) stopRepeat();
    }
    btn.addEventListener("touchend", volEnd, { passive: false });
    btn.addEventListener("touchcancel", volEnd, { passive: false });
    btn.addEventListener("mousedown", function () {
      if (Date.now() - volTouchEndAt < 700) return; // touch already handled it
      volMouseDownAt = Date.now();
      startVolRepeat(d, btn);
    });
    btn.addEventListener("mouseleave", function () {
      if (repeatEl === btn) stopRepeat(); // slid off the half
    });
    btn.addEventListener("click", function () {
      if (Date.now() - volTouchEndAt < 700) return; // press handlers already fired
      if (Date.now() - volMouseDownAt < 700) return;
      send({ t: "vol", d: d }); // keyboard / assistive activation path
    });
  });

  // ------------------------------------------------------------ trackpad
  // v1.32: the fadeHint()/hintFaded machinery is deleted with
  // the hint element it faded.
  var touches = {};        // identifier -> {x, y}
  var touchCount = 0;
  var lastX = 0, lastY = 0;   // single-finger tracking
  var lastMidX = 0, lastMidY = 0; // two-finger centroid
  var downAt = 0;
  var moved = 0;
  var longTimer = null;
  var longFired = false;
  var scrollAccum = 0;        // vertical two-finger scroll accumulator
  var scrollAccumX = 0;       // v1.33: horizontal twin of scrollAccum
  // v1.25 (Part B): menu-navigation step accumulators. In menu
  // context a drag is converted into discrete D-pad steps: every
  // NAV_STEP px of accumulated travel along the dominant axis
  // fires one {"t":"key"} step and is subtracted, so a long drag
  // walks several tiles and a short flick fires exactly one.
  var NAV_STEP = 48;
  var navAccX = 0, navAccY = 0, navScrollAcc = 0, navScrollAccX = 0;

  // v1.39: touch-engagement heartbeat for TV edge-push
  // scrolling. A finger held STILL against the screen edge
  // sends no touchmove events, so the TV cannot tell "still
  // holding" from "gone" - v1.35's push died 120ms after the
  // last move and the scroll arrived as a few jumps. Now the
  // first trackpad touch sends {t:"touch",d:1}, re-sends it
  // every 200ms while >=1 finger stays down, and the final
  // lift sends {t:"touch",d:0}. Purely additive: move/scroll
  // sending below is untouched.
  var touchBeatTimer = null;
  function touchBeatStart() {
    send({ t: "touch", d: 1 });
    if (touchBeatTimer) return;
    touchBeatTimer = setInterval(function () { send({ t: "touch", d: 1 }); }, 200);
  }
  function touchBeatStop() {
    if (touchBeatTimer) { clearInterval(touchBeatTimer); touchBeatTimer = null; }
    send({ t: "touch", d: 0 });
  }

  function fireNavSteps() {
    for (;;) {
      var ax = Math.abs(navAccX), ay = Math.abs(navAccY);
      if (Math.max(ax, ay) < NAV_STEP) break;
      if (ax >= ay) {
        sendKey(navAccX > 0 ? "right" : "left");
        navAccX -= (navAccX > 0 ? 1 : -1) * NAV_STEP;
      } else {
        sendKey(navAccY > 0 ? "down" : "up");
        navAccY -= (navAccY > 0 ? 1 : -1) * NAV_STEP;
      }
    }
  }

  function pos(t) {
    var r = pad.getBoundingClientRect();
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function cancelLong() {
    if (longTimer) { clearTimeout(longTimer); longTimer = null; }
  }

  pad.addEventListener("touchstart", function (ev) {
    ev.preventDefault();
    var wasDown = touchCount;
    for (var i = 0; i < ev.changedTouches.length; i++) {
      var t = ev.changedTouches[i];
      touches[t.identifier] = pos(t);
      touchCount++;
    }
    if (wasDown === 0 && touchCount > 0) touchBeatStart(); // v1.39
    if (touchCount === 1) {
      var p0 = pos(ev.changedTouches[0]);
      lastX = p0.x; lastY = p0.y;
      downAt = Date.now();
      moved = 0;
      navAccX = 0; navAccY = 0; // Part B: fresh drag, fresh steps
      longFired = false;
      cancelLong();
      longTimer = setTimeout(function () {
        longFired = true;
        // Browser context: a page long-press. Menu context: the
        // same command - the TV turns it into a long DPAD_CENTER
        // off-browser (v1.25), opening tile long-press menus.
        send({ t: "longtap" });
      }, 500);
    } else if (touchCount === 2) {
      cancelLong();
      var pts = Object.keys(touches).map(function (k) { return touches[k]; });
      lastMidX = (pts[0].x + pts[1].x) / 2;
      lastMidY = (pts[0].y + pts[1].y) / 2;
      scrollAccum = 0;
      scrollAccumX = 0;
      navScrollAcc = 0;
      navScrollAccX = 0;
    }
  }, { passive: false });

  pad.addEventListener("touchmove", function (ev) {
    ev.preventDefault();
    for (var i = 0; i < ev.changedTouches.length; i++) {
      var t = ev.changedTouches[i];
      if (touches[t.identifier]) touches[t.identifier] = pos(t);
    }
    if (touchCount === 1) {
      var p = pos(ev.changedTouches[0]);
      var dx = p.x - lastX, dy = p.y - lastY;
      lastX = p.x; lastY = p.y;
      var dist = Math.abs(dx) + Math.abs(dy);
      moved += dist;
      if (moved > 12) cancelLong();
      if (inMenuNav()) {
        // Part B: convert the drag into D-pad steps, evaluated
        // continuously (dominant axis recomputed per segment).
        navAccX += dx; navAccY += dy;
        fireNavSteps();
      } else if (dist > 0) {
        // Simple velocity acceleration: longer strides move faster.
        var gain = 1 + Math.min(1.6, dist / 26);
        send({ t: "move", dx: Math.round(dx * gain), dy: Math.round(dy * gain) });
      }
    } else if (touchCount === 2) {
      var pts = Object.keys(touches).map(function (k) { return touches[k]; });
      if (pts.length === 2) {
        var midX = (pts[0].x + pts[1].x) / 2;
        var midY = (pts[0].y + pts[1].y) / 2;
        var sdx = midX - lastMidX;
        var sdy = midY - lastMidY;
        lastMidX = midX;
        lastMidY = midY;
        if (inMenuNav()) {
          // Part B: two-finger scroll becomes up/down steps with
          // the same accumulator discipline. Fingers moving down
          // step UP, matching the browser scroll direction
          // convention below (drag down = view moves up).
          navScrollAcc += sdy;
          while (Math.abs(navScrollAcc) >= NAV_STEP) {
            sendKey(navScrollAcc > 0 ? "up" : "down");
            navScrollAcc -= (navScrollAcc > 0 ? 1 : -1) * NAV_STEP;
          }
          // v1.33: the horizontal pan mirrors it - fingers moving
          // right step LEFT (content follows the fingers, so you
          // see what was off-screen left), and vice versa.
          navScrollAccX += sdx;
          while (Math.abs(navScrollAccX) >= NAV_STEP) {
            sendKey(navScrollAccX > 0 ? "left" : "right");
            navScrollAccX -= (navScrollAccX > 0 ? 1 : -1) * NAV_STEP;
          }
          return;
        }
        // SCROLL_FACTOR scales the finger delta into fractional
        // accumulators (one per axis, v1.33), so slow small drags
        // build up smoothly instead of being truncated away event
        // by event.
        scrollAccum += sdy * SCROLL_FACTOR;
        scrollAccumX += sdx * SCROLL_FACTOR;
        if (Math.abs(scrollAccum) >= 2 || Math.abs(scrollAccumX) >= 2) {
          // Finger drags = page follows finger: send the negated
          // deltas, matching touch-scroll convention, in whole
          // units only; each axis's fractional remainder (converted
          // back into accumulator units) carries to the next move.
          // Final message shape: { t: "scroll", dx: <int>, dy: <int> }
          // - either component may be 0; the TV routes both through
          // doScrollBy. A message is sent only when at least one
          // component is nonzero.
          var scaledY = -scrollAccum * 3;
          var wholeY = scaledY < 0 ? Math.ceil(scaledY) : Math.floor(scaledY);
          var scaledX = -scrollAccumX * 3;
          var wholeX = scaledX < 0 ? Math.ceil(scaledX) : Math.floor(scaledX);
          if (wholeX !== 0 || wholeY !== 0) {
            send({ t: "scroll", dx: wholeX, dy: wholeY });
            scrollAccum = -(scaledY - wholeY) / 3;
            scrollAccumX = -(scaledX - wholeX) / 3;
          }
        }
      }
    }
  }, { passive: false });

  function touchEnd(ev) {
    ev.preventDefault();
    var ended = ev.changedTouches.length;
    for (var i = 0; i < ev.changedTouches.length; i++)
      delete touches[ev.changedTouches[i].identifier];
    if (touchCount === 1 && ended > 0) {
      cancelLong();
      var quick = Date.now() - downAt < 300;
      if (!longFired && quick && moved < 12) {
        // Part B: a tap on a TV menu is a select, not a page tap.
        if (inMenuNav()) sendKey("ok");
        else send({ t: "tap" });
      }
    }
    touchCount = Math.max(0, touchCount - ended);
    if (touchCount === 0) touchBeatStop(); // v1.39: last finger lifted
    if (touchCount < 2) { scrollAccum = 0; scrollAccumX = 0; navScrollAcc = 0; navScrollAccX = 0; }
    if (touchCount === 1) {
      // Re-anchor single-finger tracking after a two-finger gesture.
      var keys = Object.keys(touches);
      if (keys.length === 1) {
        lastX = touches[keys[0]].x; lastY = touches[keys[0]].y;
        downAt = Date.now(); moved = 99; // no tap after a scroll gesture
      }
    }
  }
  pad.addEventListener("touchend", touchEnd, { passive: false });
  pad.addEventListener("touchcancel", touchEnd, { passive: false });

  // Mouse fallback (desktop testing of the page).
  var mouseDown = false, mouseMoved = 0, mouseAt = 0, mX = 0, mY = 0;
  pad.addEventListener("mousedown", function (ev) {
    mouseDown = true; mouseMoved = 0; mouseAt = Date.now();
    mX = ev.clientX; mY = ev.clientY;
    navAccX = 0; navAccY = 0;
  });
  pad.addEventListener("mousemove", function (ev) {
    if (!mouseDown) return;
    var dx = ev.clientX - mX, dy = ev.clientY - mY;
    mX = ev.clientX; mY = ev.clientY;
    mouseMoved += Math.abs(dx) + Math.abs(dy);
    if (inMenuNav()) {
      navAccX += dx; navAccY += dy;
      fireNavSteps();
    } else if (dx || dy) {
      send({ t: "move", dx: dx, dy: dy });
    }
  });
  pad.addEventListener("mouseup", function () {
    if (mouseDown && Date.now() - mouseAt < 300 && mouseMoved < 6) {
      if (inMenuNav()) sendKey("ok");
      else send({ t: "tap" });
    }
    mouseDown = false;
    navAccX = 0; navAccY = 0;
  });

  applyMode();
  connect();
})();
</script>
</body>
</html>
